<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="calc-container" >
            <div class="text-container">
                <input type="text" value="0">
            </div>
            <div class="calc-buttons">
                <button class="cs_button cs_number-9" data-value="9">9</button>
                <button class="cs_button cs_number-8" data-value="8">8</button>
                <button class="cs_button cs_add" data-value="+">+</button>
                <button class="cs_button cs_number-7" data-value="7">7</button>
                <button class="cs_button cs_number-6" data-value="6">6</button>
                <button class="cs_button cs_subtract" data-value="-">-</button>
                <button class="cs_button cs_number-5" data-value="5">5</button>
                <button class="cs_button cs_number-4" data-value="4">4</button>
                <button class="cs_button cs_multiply" data-value="*">x</button>
                <button class="cs_button cs_number-3" data-value="3">3</button>
                <button class="cs_button cs_number-2" data-value="2">2</button>
                <button class="cs_button cs_divide" data-value="/">/</button>
                <button class="cs_button cs_number-1" data-value="1">1</button>
                <button class="cs_button cs_number-0" data-value="0">0</button>
                <button class="cs_button cs_clear">AC</button>
                <button class="cs_button cs_equal" data-value="">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
